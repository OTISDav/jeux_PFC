<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PFC vs IA</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>P <span>·</span> F<span>·</span> C</h1>
  <p>Montre ton geste a la camera</p>
</header>

<div class="scoreboard">
  <div class="score-item" id="score-you">
    <span class="score-label">toi</span>
    <span class="score-value" id="val-you">0</span>
  </div>
  <div class="score-div"></div>
  <div class="score-item">
    <span class="score-label">Egalite</span>
    <span class="score-value" id="val-tie" style="color: var(--paper-dim);">0</span>
  </div>
  <div class="score-div"></div>
  <div class="score-item" id="score-ia">
    <span class="score-label">IA</span>
    <span class="score-value" id="val-ia">0</span>
  </div>
</div>

<div class="viewfinder" id="viewfinder">
  <video id="input-video" playsinline autoplay muted></video>
  <canvas id="overlay"></canvas>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>
  <div class="gesture-tag" id="gesture-tag">geste : <b>—</b></div>
  <div class="countdown" id="countdown"><span id="countdown-num">3</span></div>
  <div class="result-banner" id="result-banner">
    <div class="result-row"><span>Toi</span><span id="res-you">—</span></div>
    <div class="result-row"><span>IA</span><span id="res-ia">—</span></div>
    <div class="verdict" id="res-verdict">—</div>
  </div>
</div>

<div class="controls">
  <button id="btn-play">Lancer une manche</button>
  <button id="btn-reset">Reinitialiser le score</button>
</div>

<p class="status" id="status">Autorise la camera puis appuie sur Lancer une manche </p>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<!-- Point d'entree de app-->
<script type="module" src="src/main.js"></script>
</body>
</html>
